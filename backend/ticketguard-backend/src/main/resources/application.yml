spring:

  application:
    name: ticketguard-backend

  datasource:
    url: jdbc:mysql://localhost:3306/ticketguard
    username: YOUR_DATABASE_USERNAME
    password: YOUR_DATABASE_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: YOUR_EMAIL@gmail.com
    password: YOUR_APP_PASSWORD

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

jwt:
  secret: YOUR_256_BIT_SECRET_KEY
  expiration: 86400000

logging:
  level:
    root: INFO
    org.springframework.security: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:

  frontend-url: http://localhost:5173

  ticket:

    qr-directory: qrcodes/

    pdf-directory: tickets/