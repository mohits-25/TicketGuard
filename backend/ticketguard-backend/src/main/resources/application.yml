spring:
  application:
    name: ticketguard-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ticketguard
    username: postgres
    password: YOUR_POSTGRES_PASSWORD
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

server:
  port: 8080

jwt:
  secret: YOUR_JWT_SECRET
  expiration: 86400000

logging:
  level:
    com.ticketguard.ticketguard_backend: INFO